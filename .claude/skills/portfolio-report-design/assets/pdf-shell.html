<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reporte de portafolio — PDF shell</title>
<!-- Real webfonts (display + body pairing). For an offline-proof PDF, base64 the
     woff2 files into @font-face instead; the fallback stack in the tone tokens
     must still look deliberate if the request fails. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  pdf-shell.html — runnable skeleton for the report PDF (vertical formal document).
  Implements references/pdf-document.md: fixed page model, measured pagination,
  print type scale, section accent rotation, the seven image/text patterns,
  static print charts, splittable tables with repeated headers.

  Copy this file, replace REPORT + STR with the real data contract / language map,
  and keep the page model and the build order intact:
      DOM → embed images → fonts.ready → img.decode() → paginate → chrome → html2pdf
  The sample portfolio below is fictional and lives ONLY in this shell — nothing
  portfolio-specific belongs in a template (SKILL.md § Key constraints).
-->
<style>
/* ── tone tokens (brand default — see assets/tone-tokens.css) ─────────────── */
:root{
  --tone-text:#171b2a; --tone-text-muted:#646b7c; --tone-panel:#f2f4fd;
  --tone-accent:#556eff; --tone-accent-2:#7892ff; --tone-footnote-color:#98a0b2;
  --tone-up:#12996b; --tone-down:#e0483d;
  --tone-font-display:"Manrope","Segoe UI",sans-serif;
  --tone-font-body:"Inter","Segoe UI",sans-serif;

  /* paper palette (pdf-document.md §4) */
  --pdf-paper:#fff; --pdf-paper-2:var(--tone-panel);
  --pdf-ink:var(--tone-text); --pdf-ink-soft:#454b5e;
  --pdf-ink-muted:var(--tone-text-muted); --pdf-ink-faint:var(--tone-footnote-color);
  --pdf-rule:#e3e7f2;
  --pdf-accent:var(--tone-accent); --pdf-accent-2:var(--tone-accent-2);
  --pdf-up:var(--tone-up); --pdf-down:var(--tone-down);
  /* section accent rotation */
  --pdf-section-1:#556eff; --pdf-section-2:#0e7c86; --pdf-section-3:#a86212;
  --pdf-section-4:#6a3fd1; --pdf-section-5:#b03a63;
}
[data-acc="1"]{--sec:var(--pdf-section-1)} [data-acc="2"]{--sec:var(--pdf-section-2)}
[data-acc="3"]{--sec:var(--pdf-section-3)} [data-acc="4"]{--sec:var(--pdf-section-4)}
[data-acc="5"]{--sec:var(--pdf-section-5)}

*{box-sizing:border-box;margin:0;padding:0}
body{background:#40434d}
/* preview chrome only — removed by .exporting before html2pdf runs */
#doc{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px 0}
body.exporting{background:#fff}
body.exporting #doc{gap:0;padding:0;display:block}
body.exporting .page{box-shadow:none;margin:0 auto}
body.exporting [data-dev]{display:none!important}

/* ── page model (pdf-document.md §1) ──────────────────────────────────────── */
.page,#flow{font-family:var(--tone-font-body);color:var(--pdf-ink);font-size:11.5px;line-height:1.62;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.page{width:794px;height:1123px;position:relative;overflow:hidden;background:var(--pdf-paper);
  box-shadow:0 2px 18px rgba(0,0,0,.35)}
/* Sin page-break-before/break-before: html2pdf inserta un espaciador por cada
   regla de salto y genera una hoja en blanco por página (medido con 0.10.2).
   La geometría fija ya pagina 1:1 — ver references/pdf-document.md §1. */
.page-body{position:absolute;left:48px;top:58px;width:698px;height:1000px}
.page-body > :first-child{margin-top:0!important}
.page-head{position:absolute;left:48px;right:48px;top:24px;height:22px;display:flex;
  justify-content:space-between;align-items:flex-end;padding-bottom:5px;border-bottom:1px solid var(--pdf-rule);
  font-size:7.6px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--pdf-ink-faint)}
.page-foot{position:absolute;left:48px;right:48px;bottom:26px;height:22px;display:flex;
  justify-content:space-between;align-items:flex-start;padding-top:5px;border-top:1px solid var(--pdf-rule);
  font-size:7.5px;color:var(--pdf-ink-faint);letter-spacing:.04em}
.page-foot b{color:var(--pdf-ink-muted);font-weight:700}
#flow{position:fixed;left:-10000px;top:0;width:698px}

/* ── type (pdf-document.md §3) ────────────────────────────────────────────── */
.eyebrow{font-size:7.8px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--sec,var(--pdf-accent))}
.sec-head{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;padding-bottom:7px;
  border-bottom:2px solid var(--sec,var(--pdf-accent))}
.sec-head .num{font-family:var(--tone-font-display);font-size:20px;font-weight:800;
  color:var(--sec,var(--pdf-accent));letter-spacing:-.02em;min-width:26px}
.sec-head h2{font-family:var(--tone-font-display);font-size:20px;font-weight:750;letter-spacing:-.015em}
.sec-head .hint{margin-left:auto;font-size:8px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--pdf-ink-faint)}
h3.h3{font-size:12px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;
  color:var(--sec,var(--pdf-accent));margin:0 0 6px}
.verdict{font-family:var(--tone-font-display);font-size:24px;font-weight:750;line-height:1.15;
  letter-spacing:-.02em;margin:0 0 8px}
.verdict em{font-style:normal;color:var(--sec,var(--pdf-accent))}
.lede{font-size:13.5px;line-height:1.5;color:var(--pdf-ink-soft);margin:0 0 12px;max-width:560px}
p.body{font-size:11.5px;line-height:1.62;color:var(--pdf-ink-soft);margin:0 0 9px;max-width:500px}
p.body strong{color:var(--pdf-ink);font-weight:700}
/* Capitular como <span>, no ::first-letter: html2canvas rasteriza mal el
   pseudo-elemento flotado y la primera línea sale descolocada. */
.dc{float:left;font-family:var(--tone-font-display);font-size:31px;line-height:.82;font-weight:800;
  margin:3px 4px 0 0;color:var(--sec,var(--pdf-accent))}
.prose-rail{display:grid;grid-template-columns:452px 219px;gap:27px;align-items:start}
.sidenote{font-size:8.8px;line-height:1.5;color:var(--pdf-ink-muted);border-left:2px solid var(--sec,var(--pdf-accent));
  padding-left:9px;margin-bottom:12px}
.sidenote b{display:block;font-family:var(--tone-font-display);font-size:15px;font-weight:800;
  color:var(--pdf-ink);letter-spacing:-.01em}
.pullquote{font-family:var(--tone-font-display);font-size:18px;line-height:1.3;font-weight:700;
  letter-spacing:-.015em;color:#fff;max-width:400px}
.footnote{font-size:7.5px;line-height:1.5;color:var(--pdf-ink-faint);margin-top:6px}

/* ── components ───────────────────────────────────────────────────────────── */
/* minmax(0,1fr): con 1fr una cifra larga no deja encoger el track y la fila se
   sale de los 698px — se imprime recortada contra el borde de la página. */
.kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:0 0 12px}
.kpi-row.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi-row.k6{grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
.kpi-row.k6 .kpi{padding:7px 7px 8px}
.kpi-row.k6 .kpi strong{font-size:14.5px}
.kpi-row.k6 .kpi span{font-size:7.6px;letter-spacing:.03em}
.kpi{border-top:2px solid var(--sec,var(--pdf-accent));background:var(--pdf-paper-2);border-radius:0 0 6px 6px;
  padding:8px 9px 9px}
.kpi span{display:block;font-size:7.8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--pdf-ink-muted);margin-bottom:3px}
.kpi strong{display:block;font-family:var(--tone-font-display);font-size:19px;font-weight:800;letter-spacing:-.02em}
.kpi small{display:block;font-size:7.6px;color:var(--pdf-ink-faint);margin-top:2px}
.up{color:var(--pdf-up)} .down{color:var(--pdf-down)}
.diag-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}
.diag{border:1px solid var(--pdf-rule);border-left:3px solid var(--pdf-ink-faint);border-radius:5px;padding:8px 9px}
.diag.good{border-left-color:var(--pdf-up)} .diag.warn{border-left-color:#c98a12} .diag.bad{border-left-color:var(--pdf-down)}
.diag span{display:block;font-size:7.6px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--pdf-ink-muted);margin-bottom:3px}
.diag strong{display:block;font-family:var(--tone-font-display);font-size:14px;font-weight:800;line-height:1.2}
.diag small{display:block;font-size:8px;color:var(--pdf-ink-muted);line-height:1.4;margin-top:3px}
.chart-box{border:1px solid var(--pdf-rule);border-radius:6px;padding:10px 11px 9px;margin-bottom:12px}
.chart-h{font-size:8.2px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--pdf-ink-muted);margin-bottom:8px}
.cap{font-size:7.8px;color:var(--pdf-ink-faint);line-height:1.45;margin-top:7px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;margin-bottom:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start;margin-bottom:12px}
.callout{background:var(--pdf-paper-2);border-left:3px solid var(--sec,var(--pdf-accent));border-radius:0 5px 5px 0;
  padding:9px 12px;margin-bottom:12px;font-size:10.5px;line-height:1.55;color:var(--pdf-ink-soft)}
.callout b{color:var(--pdf-ink)}
.alerts{border:1px solid #f1cfcf;background:#fdf5f5;border-left:3px solid var(--pdf-down);border-radius:0 5px 5px 0;
  padding:8px 11px;margin-bottom:12px;font-size:9.6px;line-height:1.6;color:#8e3b3b}
.metric-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.metric{border:1px solid var(--pdf-rule);border-radius:5px;padding:7px 8px;text-align:center}
.metric span{display:block;font-size:7.6px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--pdf-ink-muted);margin-bottom:2px}
.metric strong{font-family:var(--tone-font-display);font-size:14px;font-weight:800}
.metric em{display:block;font-style:normal;font-size:7.6px;color:var(--pdf-ink-faint);margin-top:1px}

/* mover card (§VI) + dossier (§VII) */
.mover{display:grid;grid-template-columns:150px 1fr;gap:14px;border:1px solid var(--pdf-rule);border-radius:6px;
  padding:11px 12px;margin-bottom:11px}
.mover .t{font-family:var(--tone-font-display);font-size:17px;font-weight:800;letter-spacing:-.01em}
.mover .figs{font-size:8.6px;color:var(--pdf-ink-muted);margin:2px 0 7px;line-height:1.5}
.mover ul{list-style:none;font-size:10px;line-height:1.5}
.mover li{padding-left:66px;position:relative;margin-bottom:4px;color:var(--pdf-ink-soft)}
.mover li b{position:absolute;left:0;top:1px;width:60px;font-size:7.6px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--sec,var(--pdf-accent))}
.dossier{display:grid;grid-template-columns:96px 1fr;gap:12px;border:1px solid var(--pdf-rule);border-radius:6px;
  padding:11px 12px;margin-bottom:10px}
.dossier .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.dossier .hd b{font-family:var(--tone-font-display);font-size:15px;font-weight:800}
.dossier .hd span{font-size:8px;color:var(--pdf-ink-faint);letter-spacing:.06em;text-transform:uppercase}
.dossier .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.dossier .grid div{font-size:8.2px;color:var(--pdf-ink-muted)}
.dossier .grid strong{display:block;font-size:11px;color:var(--pdf-ink);font-weight:800}
.dossier p{font-size:9.6px;line-height:1.5;color:var(--pdf-ink-soft)}

/* ── tables (pdf-document.md §9) ──────────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:9.2px}
thead th{border-bottom:1px solid var(--pdf-ink-muted);font-size:8px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--pdf-ink-muted);padding:5px 7px;text-align:left}
tbody td{border-bottom:1px solid var(--pdf-rule);padding:5px 7px;height:17px}
tbody tr:last-child td{border-bottom:none}
th.n,td.n{text-align:right}
.tbl{margin-bottom:12px}
.tbl-cont{font-size:7.6px;color:var(--pdf-ink-faint);text-align:right;padding-top:4px;font-style:italic}
.tbl-cont-head{font-size:7.6px;color:var(--pdf-ink-faint);padding-bottom:4px;font-style:italic}
.gloss{columns:2;column-gap:26px;font-size:9.4px;line-height:1.5;color:var(--pdf-ink-soft)}
.gloss div{break-inside:avoid;margin-bottom:7px}
.gloss b{color:var(--pdf-ink)}

/* ── imagery patterns (pdf-document.md §5) ────────────────────────────────── */
.img-wrap{position:relative;overflow:hidden;background:var(--pdf-paper-2)}
.img-wrap img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.18) contrast(1.05)}
.img-wrap .tint{position:absolute;inset:0;background:var(--sec,var(--pdf-accent));mix-blend-mode:multiply;opacity:.42}
.img-wrap .scrim{position:absolute;inset:0}
.credit{font-size:7.5px;color:var(--pdf-ink-faint);margin-top:4px;letter-spacing:.02em}
.credit.on-img{position:absolute;right:10px;bottom:8px;color:rgba(255,255,255,.72);margin:0}
.credit.on-img.top{top:10px;bottom:auto}
/* cover */
.cover-img{position:absolute;left:0;top:0;width:794px;height:640px}
.cover-card{position:absolute;left:48px;right:48px;top:500px;background:var(--pdf-paper);padding:26px 28px 22px;
  border-top:4px solid var(--pdf-accent)}
.cover-index{position:absolute;left:48px;right:48px;top:790px}
.cover-index .k{font-size:7.8px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--pdf-ink-muted);border-bottom:1px solid var(--pdf-rule);padding-bottom:6px;margin-bottom:10px}
.cover-index ol{list-style:none;columns:3;column-gap:22px;font-size:9px;color:var(--pdf-ink-muted);line-height:1.45}
.cover-index li{break-inside:avoid;margin-bottom:7px}
.cover-index li b{display:block;font-size:10px;font-weight:750;color:var(--pdf-ink)}
.cover-index li b i{font-style:normal;color:var(--pdf-accent);margin-right:5px}
.cover-read{font-size:9.2px;color:var(--pdf-ink-muted);line-height:1.5;margin-top:12px;padding-top:10px;
  border-top:1px solid var(--pdf-rule);max-width:560px}
.cover-title{font-family:var(--tone-font-display);font-size:46px;font-weight:800;letter-spacing:-.025em;line-height:1.02}
.cover-sub{font-size:11px;color:var(--pdf-ink-muted);margin-top:8px;letter-spacing:.02em}
.cover-figs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px;padding-top:16px;
  border-top:1px solid var(--pdf-rule)}
.cover-figs span{display:block;font-size:7.8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--pdf-ink-muted);margin-bottom:3px}
.cover-figs strong{font-family:var(--tone-font-display);font-size:26px;font-weight:800;letter-spacing:-.02em}
.cover-foot{position:absolute;left:48px;right:48px;bottom:44px;display:flex;justify-content:space-between;
  font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--pdf-ink-faint)}
/* section opener */
.opener-img{position:absolute;left:0;top:0;width:794px;height:470px}
.opener-num{position:absolute;left:44px;bottom:18px;font-family:var(--tone-font-display);font-size:132px;
  font-weight:800;line-height:.8;color:rgba(255,255,255,.30);letter-spacing:-.05em}
.opener-body{position:absolute;left:48px;right:48px;top:522px}
.opener-figs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px;padding-top:18px;
  border-top:1px solid var(--pdf-rule)}
.opener-figs span{display:block;font-size:7.8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--pdf-ink-muted);margin-bottom:4px}
.opener-figs strong{font-family:var(--tone-font-display);font-size:24px;font-weight:800;letter-spacing:-.02em}
.opener-figs small{display:block;font-size:8.6px;color:var(--pdf-ink-muted);margin-top:3px;line-height:1.4}
.opener-body h2{font-family:var(--tone-font-display);font-size:34px;font-weight:800;letter-spacing:-.025em;
  line-height:1.08;margin:8px 0 12px}
.opener-body .lede{font-size:14px;max-width:600px}
.opener-toc{position:absolute;left:48px;right:48px;bottom:120px;border-top:1px solid var(--pdf-rule);padding-top:12px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:9px;color:var(--pdf-ink-muted)}
.opener-toc b{display:block;color:var(--pdf-ink);font-size:10px;font-weight:750}
/* band + duotone + rail + inset */
.img-band{width:698px;height:150px;border-radius:6px;margin-bottom:12px;display:flex;align-items:center;padding:0 26px}
.img-duotone{width:698px;height:190px;border-radius:6px;margin-bottom:12px;display:flex;align-items:center;padding:0 26px}
.img-rail{width:219px;height:280px;border-radius:6px}
.img-inset{width:96px;height:96px;border-radius:8px}
.img-closing{position:absolute;left:0;bottom:0;width:794px;height:560px}
.closing-body{position:absolute;left:48px;right:48px;top:88px}
.closing-body h2{font-family:var(--tone-font-display);font-size:30px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.closing-figs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0 0 16px;
  padding:14px 0;border-top:1px solid var(--pdf-rule);border-bottom:1px solid var(--pdf-rule)}
.closing-figs span{display:block;font-size:7.6px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--pdf-ink-muted);margin-bottom:3px}
.closing-figs strong{font-family:var(--tone-font-display);font-size:16px;font-weight:800}
.disclaimer{border:1px solid var(--pdf-rule);border-left:3px solid #c98a12;border-radius:0 5px 5px 0;padding:10px 12px;
  font-size:9.4px;line-height:1.6;color:var(--pdf-ink-soft);margin-bottom:12px}

/* dev toolbar — never part of the deliverable */
.devbar{position:fixed;left:12px;bottom:12px;z-index:99;background:#15161c;color:#e8eaf2;border:1px solid #333;
  border-radius:8px;padding:9px 12px;font:12px/1.5 ui-monospace,monospace;display:flex;gap:10px;align-items:center}
.devbar button{background:var(--pdf-accent);color:#fff;border:0;border-radius:5px;padding:5px 10px;font:inherit;cursor:pointer}
.devbar .ok{color:#4ade80} .devbar .bad{color:#f87171}
[data-oversize],[data-overflow]{outline:2px dashed #f87171!important}
</style>
</head>
<body>

<div id="doc"></div>
<div id="flow"></div>

<div class="devbar" data-dev>
  <span id="audit">paginando…</span>
  <button onclick="exportPdf()">Descargar PDF</button>
</div>

<script src="pdf-charts.js"></script>
<script src="pdf-paginate.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   1. DATA — mirrors references/data-contract.md. Fictional sample: replace the
   whole object with the real computeHistoricalReport() output. Nothing below
   this block may contain a ticker, a name or a figure.
   ═══════════════════════════════════════════════════════════════════════════ */

    { label:'Dividendos', value:842, sub:'9 pagos' },

  ],
  months: [
    { label:'Ene', value:2.1 }, { label:'Feb', value:4.8 }, { label:'Mar', value:-3.2 },
    { label:'Abr', value:1.4 }, { label:'May', value:6.9 }, { label:'Jun', value:-1.8 },
    { label:'Jul', value:3.6 }
  ],

const flow = document.getElementById('flow');
const charts = [];   // [node, type, data, opts] — mounted before pagination

function blk(html, attrs) {
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  const node = d.children.length === 1 ? d.firstElementChild : d;
  if (d.children.length !== 1) d.className = 'blk';
  Object.entries(attrs || {}).forEach(([k, v]) => node.setAttribute(k, v));
  flow.appendChild(node);
  return node;
}
function chart(type, data, opts) {
  const id = 'c' + charts.length;
  charts.push([id, type, data, opts || {}]);
  return '<div id="' + id + '"></div>';
}
function img(pattern, key, extra, creditTop) {
  const im = REPORT.images[key];
  const sz = { 'img-band':[698,150], 'img-duotone':[698,190], 'img-rail':[219,280],
               'img-inset':[96,96], 'cover-img':[794,640], 'opener-img':[794,470], 'img-closing':[794,560] }[pattern];
  return '<div class="img-wrap ' + pattern + '" style="background:' + im.avg + '">' +
         '<img src="' + im.src + '" width="' + sz[0] + '" height="' + sz[1] + '" alt="">' +
         '<div class="tint"></div>' + (extra || '') +
         '<span class="credit on-img' + (creditTop ? ' top' : '') + '">Foto: ' + im.by + ' · Pexels</span></div>';
}
function secHead(num, title, hint, acc) {
  return blk('<div class="sec-head"><span class="num">' + num + '</span><h2>' + title + '</h2>' +
             (hint ? '<span class="hint">' + hint + '</span>' : '') + '</div>',
             { 'data-keep-with-next':'', 'data-min-space':'170', 'data-acc':acc,
               'data-section':num + ' · ' + title });
}

/* sample series generators — real builds pass data.equityCurve straight through */
// Curva sintética con forma controlada: pico en la sesión 30, mínimo en la 45
// (caída máxima −9.4% desde el máximo previo) y cierre en +14.38%, para que el
// gráfico, el chart underwater y el texto de la carta digan lo mismo.
function series() {
  const n = 126, port = [], bench = [], cost = [];
  const keyP = [[0,0],[30,9.8],[45,-0.83],[62,5.4],[78,9.6],[92,7.2],[108,12.1],[118,10.4],[125,14.38]];
  const keyB = [[0,0],[30,7.1],[45,1.2],[62,4.6],[78,7.8],[92,6.4],[108,9.6],[118,8.7],[125,10.67]];
  const at = (keys, i) => {
    for (let k = 1; k < keys.length; k++) {
      if (i <= keys[k][0]) {
        const [x0, y0] = keys[k - 1], [x1, y1] = keys[k];
        const u = (i - x0) / (x1 - x0);
        return y0 + (y1 - y0) * (u * u * (3 - 2 * u));            // smoothstep
      }
    }
    return keys[keys.length - 1][1];
  };
  for (let i = 0; i < n; i++) {
    const iso = new Date(2026, 0, 15 + Math.round(i * 1.43)).toISOString().slice(0, 10);
    const noise = Math.sin(i / 2.7) * 0.22 + Math.sin(i / 6.1) * 0.16;   // determinista
    port.push({ t: iso, value: +(at(keyP, i) + noise).toFixed(2) });
    bench.push({ t: iso, value: +(at(keyB, i) + noise * 0.6).toFixed(2) });
    cost.push({ t: iso, value: +(i * 0.018).toFixed(2) });
  }
  return { series: port, bench: bench, extra: cost, format:'pct', ddFrom:30, ddTo:45,
           seriesLabel:'Portafolio', benchLabel:'S&P 500', extraLabel:'Capital invertido', ddLabel:'caída máxima −9.4%' };
}
// Caída real desde el máximo previo, no la resta de retornos acumulados:
// (1+v)/(1+pico) − 1. La diferencia entre ambas es lo que hacía que el gráfico
// dijera −30% mientras el texto decía −9.4%.
function underwaterSeries() {
  const s = series().series, out = [];
  let peak = -Infinity;
  s.forEach(p => {
    peak = Math.max(peak, p.value);
    out.push({ t: p.t, value: +(((1 + p.value / 100) / (1 + peak / 100) - 1) * 100).toFixed(2) });
  });
  return out;
}
function txRows() {
  const kinds = [['COMPRA','up'], ['VENTA','down'], ['DIVIDENDO','']];
  const tk = ['NVDA','MSFT','VOO','TSM','BIMBOA.MX','PLTR','SHOP.TO','FMTY14.MX'];
  let out = '';
  for (let i = 0; i < 18; i++) {
    const k = kinds[i % 3], t = tk[i % tk.length];
    const d = new Date(2026, 0, 18 + i * 9).toLocaleDateString('es-MX');
    out += '<tr><td>' + d + '</td><td class="' + k[1] + '"><strong>' + k[0] + '</strong></td><td><strong>' + t +
      '</strong></td><td class="n">' + (4 + i % 7) + '</td><td class="n">' + (120 + i * 13.4).toFixed(2) +
      '</td><td class="n">' + (2 + i % 4).toFixed(2) + '</td><td class="n">' + (480 + i * 61).toFixed(2) + '</td></tr>';
  }
  return out;
}

// html2canvas silently drops cross-origin images: embed them as data URIs first.
// Falls back to the tone panel (avg_color already painted) if the fetch fails.
async function embedImages(root) {
  const seen = new Map();
  await Promise.all([...root.querySelectorAll('img[src^="http"]')].map(async el => {
    try {
      if (!seen.has(el.src)) {
        seen.set(el.src, fetch(el.src, { mode:'cors' }).then(r => r.blob()).then(b =>
          new Promise(res => { const f = new FileReader(); f.onload = () => res(f.result); f.readAsDataURL(b); })));
      }
      el.src = await seen.get(el.src);
    } catch (e) { console.warn('[pdf] imagen no embebida, se usa el panel de tono:', e.message); el.remove(); }
  }));
}

(async function build() {
  await embedImages(flow);
  await BPPdfPaginate.ready(document);
  const r = BPPdfPaginate.run({
    flow, mount: document.getElementById('doc'),
    strings: { continues: STR.continues, continued: STR.continued },
    chrome(page, n, total, section) {
      if (page.classList.contains('bleed')) return;
      const h = document.createElement('div');
      h.className = 'page-head';
      h.innerHTML = '<span>' + REPORT.meta.name + ' · ' + REPORT.meta.period + '</span><span>' + section + '</span>';
      const f = document.createElement('div');
      f.className = 'page-foot';
      f.innerHTML = '<span>BlackPortfolio · ' + REPORT.meta.folio + '</span><span><b>' + n + '</b> / ' + total + '</span>';
      page.appendChild(h); page.appendChild(f);
    }
  });
  window.__pdfAudit = { pages: r.pages.length, warnings: r.warnings };
  const el = document.getElementById('audit');
  el.className = r.warnings.length ? 'bad' : 'ok';
  el.textContent = r.pages.length + ' páginas · ' +
    (r.warnings.length ? r.warnings.length + ' avisos: ' + r.warnings[0] : 'sin desbordes');
})();

/* html2pdf with the settings that match the page model (pdf-document.md §1). */
async function exportPdf() {
  if (!window.html2pdf) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js';
      s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar html2pdf'));
      document.head.appendChild(s);
    });
  }
  document.body.classList.add('exporting');
  try {
    await html2pdf().set({
      margin: 0,
      image: { type:'jpeg', quality:0.96 },
      // scale ENTERO: html2pdf corta en floor(1123 × scale); con 1.6 el sobrante
      // acumulado agrega una página casi en blanco al final (medido).
      html2canvas: { scale:2, useCORS:true, backgroundColor:'#ffffff', logging:false },
      jsPDF: { unit:'px', format:[794, 1123], orientation:'portrait', hotfixes:['px_scaling'] },
      pagebreak: { mode:[] }
    }).from(document.getElementById('doc')).save('Reporte_' + REPORT.meta.folio + '.pdf');
  } finally { document.body.classList.remove('exporting'); }
}
