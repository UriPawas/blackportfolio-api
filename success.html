<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago exitoso | BlackPortfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function(){
      var s=localStorage.getItem('bp-theme');
      var d=window.matchMedia('(prefers-color-scheme:dark)').matches;
      document.documentElement.setAttribute('data-theme', s || (d ? 'dark' : 'light'));
    })();
  </script>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .success-card {
      text-align:center; max-width:420px; padding:3rem 2.5rem;
      background:var(--surface, rgba(255,255,255,0.04));
      border:1px solid rgba(50,214,162,0.3); border-radius:24px;
      box-shadow:0 32px 80px rgba(0,0,0,0.4);
    }
    .success-icon { font-size:3.5rem; display:block; margin-bottom:1.25rem; }
    .success-card h1 { font-size:1.6rem; margin:0 0 0.5rem; letter-spacing:-0.03em; }
    .success-card p { color:var(--muted); line-height:1.6; margin-bottom:2rem; }
    .success-actions { display:flex; flex-direction:column; gap:0.75rem; }
    .badge {
      display:inline-block; padding:0.25rem 0.75rem; border-radius:999px;
      font-size:0.75rem; font-weight:600; letter-spacing:0.05em;
      background:rgba(50,214,162,0.15); color:#32d6a2;
      border:1px solid rgba(50,214,162,0.3); margin-bottom:1.5rem;
    }
    .plan-badge {
      display:inline-block; padding:0.2rem 0.6rem; border-radius:6px;
      font-size:0.8rem; font-weight:600;
      background:rgba(111,134,255,0.15); color:#6f86ff;
      border:1px solid rgba(111,134,255,0.3);
    }
  </style>
</head>
<body>
  <div class="background-orb orb-one"></div>
  <div class="background-orb orb-two"></div>
  <div class="grid-overlay"></div>

  <div class="success-card">
    <span class="success-icon">✅</span>
    <span class="badge">PAGO CONFIRMADO</span>
    <h1>¡Suscripción activada!</h1>
    <p>Tu plan <span class="plan-badge" id="activePlan">BlackPortfolio</span> está activo. Ya puedes acceder a todas las funciones incluidas en tu suscripción.</p>
    <div class="success-actions">
      <a class="button primary" href="main.html">Ir al dashboard →</a>
      <a class="button secondary" href="index.html">Volver a la landing</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="auth.js?v=8"></script>
  <script>
    (function () {
      const _IS_LOCAL = location.hostname === "127.0.0.1" || location.hostname === "localhost";
      const API_BASE = _IS_LOCAL
        ? "http://127.0.0.1:8000"
        : "https://blackportfolio-api-production.up.railway.app";

      firebase.auth().onAuthStateChanged(async function (user) {
        if (!user) return;

        const auth = window.BlackPortfolioAuth;
        const planEl = document.getElementById("activePlan");
        let plan = auth?.getSession()?.selectedPlan || "BlackPortfolio";
        let confirmed = false;

        // Confirma el pago server-side (Railway) y fija el plan en Postgres.
        const sessionId = new URLSearchParams(location.search).get("session_id");
        if (sessionId) {
          try {
            const idToken = await user.getIdToken();
            const res = await fetch(`${API_BASE}/api/billing/stripe/confirm`, {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${idToken}` },
              body: JSON.stringify({ sessionId })
            });
            if (res.ok) {
              const data = await res.json();
              if (data.plan) {
                plan = data.plan;
                auth?.setPlan?.(data.plan);
                confirmed = true;
              }
            }
          } catch (_) {}
        }

        if (confirmed) auth?.markCheckoutReady?.();
        if (planEl) planEl.textContent = confirmed ? plan : "Confirmación pendiente";
      });
    })();
  </script>
</body>
</html>
