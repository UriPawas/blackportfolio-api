<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago exitoso | BlackPortfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function(){
      var s=localStorage.getItem('bp-theme');
      var d=window.matchMedia('(prefers-color-scheme:dark)').matches;
      document.documentElement.setAttribute('data-theme', s || (d ? 'dark' : 'light'));
    })();
  </script>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .success-card {
      text-align:center; max-width:420px; padding:3rem 2.5rem;
      background:var(--surface, rgba(255,255,255,0.04));
      border:1px solid rgba(50,214,162,0.3); border-radius:24px;
      box-shadow:0 32px 80px rgba(0,0,0,0.4);
    }
    .success-icon { font-size:3.5rem; display:block; margin-bottom:1.25rem; }
    .success-card h1 { font-size:1.6rem; margin:0 0 0.5rem; letter-spacing:-0.03em; }
    .success-card p { color:var(--muted); line-height:1.6; margin-bottom:2rem; }
    .success-actions { display:flex; flex-direction:column; gap:0.75rem; }
    .badge {
      display:inline-block; padding:0.25rem 0.75rem; border-radius:999px;
      font-size:0.75rem; font-weight:600; letter-spacing:0.05em;
      background:rgba(50,214,162,0.15); color:#32d6a2;
      border:1px solid rgba(50,214,162,0.3); margin-bottom:1.5rem;
    }
  </style>
</head>
<body>
  <div class="background-orb orb-one"></div>
  <div class="background-orb orb-two"></div>
  <div class="grid-overlay"></div>

  <div class="success-card">
    <span class="success-icon">✅</span>
    <span class="badge">PAGO CONFIRMADO</span>
    <h1>¡Suscripción activada!</h1>
    <p>Tu plan de BlackPortfolio está activo. Ya puedes acceder a todas las funciones incluidas en tu suscripción.</p>
    <div class="success-actions">
      <a class="button primary" href="main.html">Ir al dashboard →</a>
      <a class="button secondary" href="index.html">Volver a la landing</a>
    </div>
  </div>

  <script>
    // Mark checkout as ready for this session
    const params = new URLSearchParams(location.search);
    const sessionId = params.get("session_id");
    if (sessionId && window.BlackPortfolioAuth) {
      window.BlackPortfolioAuth.markCheckoutReady?.();
    }
  </script>
</body>
</html>
