<script>
  /* tema antes del primer pintado: la misma preferencia de la landing (bp-theme) y de la app anterior (blackportfolio-theme) */
  (function () {
    var t = null;
    try { t = localStorage.getItem('bp-theme') || localStorage.getItem('blackportfolio-theme'); } catch (e) { }
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
  /* entrada desde login o registro: campo-gate.js reproduce el "tablero" al cargar */
  (function () {
    try {
      if (document.referrer) {
        var u = new URL(document.referrer);
        if (u.origin === location.origin && /\/(login|registro)\.html$/.test(u.pathname)) sessionStorage.setItem('portify-gate', '1');
      }
    } catch (e) { }
  })();
</script>

<style>
  /* arranque: mientras llegan los datos reales, el cascarón ya está y un aviso dice qué pasa */
  .boot { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; padding: 12px 16px; border-radius: 12px;
    background: var(--s1); border: 1px solid var(--line); color: var(--text-2); font: 500 14px/1.4 var(--font); }
  .boot[data-state="done"], .boot[data-state="load"] { display: none; } /* mientras carga manda el tablero (campo-gate.js), no un aviso */
  .boot .boot-spin { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid color-mix(in oklab, var(--accent) 25%, transparent); border-top-color: var(--accent); animation: bootspin .8s linear infinite; }
  .boot[data-state="error"] { color: var(--text); border-color: color-mix(in oklab, var(--loss) 45%, var(--line)); }
  .boot[data-state="error"] .boot-spin { display: none; }
  .boot .boot-act { display: none; margin-left: auto; gap: 8px; }
  .boot[data-state="error"] .boot-act { display: flex; }
  @keyframes bootspin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .boot .boot-spin { animation-duration: 2.4s; } }
  .side-old { display: block; margin: 0 0 8px; color: var(--text-3); font: 500 12.5px/1.3 var(--font); text-decoration: none; }
  .home-acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .ccy-seg { font-size: 12.5px; }
  .tk-ccy:empty { display: none; }
  .side-old:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  @media (max-width: 860px) { .side-old { display: none; } }
  /* producción: crear, editar y registrar ya se guardan; lo que aún no existe aquí (importar CSV, alertas) se oculta */
  .tk-old { display: none; }
  .campo-real [data-tk="import"], .campo-real [data-act="imp"], .campo-real .fi-act [data-act], .campo-real .fi-mode { display: none !important; }
  .txs-iva { margin-top: 6px; font-size: 12.5px; }
</style>
