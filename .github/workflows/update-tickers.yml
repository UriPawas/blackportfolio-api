name: Actualizar precios de tickers

# Corre semanalmente, actualiza tickers.json / tickers-data.js y hace commit.
#
# Ya NO despliega por su cuenta. Antes terminaba con un `firebase deploy` propio,
# lo que creaba una segunda via de publicacion a produccion — y como corria sobre
# `master`, habria publicado la rama equivocada. Ahora solo hace push: el push a
# master dispara `deploy-hosting.yml`, que es la unica via de despliegue y la que
# lleva los guardias.
#
# Llevaba 12 ejecuciones fallidas seguidas desde el 2026-06-15 porque el
# GITHUB_TOKEN no tenia permiso de escritura. De ahi el bloque `permissions`.

on:
  schedule:
    - cron: '0 8 * * 1'   # lunes 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write         # sin esto el push falla con 403

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Actualizar tickers
        run: python update_tickers.py

      # Sin "[skip ci]": justamente queremos que el push dispare el despliegue.
      - name: Hacer commit si hubo cambios
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tickers.json tickers-data.js
          if git diff --cached --quiet; then
            echo "Sin cambios en los tickers; no se publica nada."
          else
            git commit -m "chore(tickers): actualiza precios semanales"
            git push
            echo "Cambios publicados; deploy-hosting.yml se encargara del despliegue."
          fi
