name: Update Ticker Prices

on:
  schedule:
    - cron: '0 8 * * 1'   # Lunes 8am UTC (cada semana)
  workflow_dispatch:        # Permite correrlo manualmente desde GitHub

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run update_tickers.py
        run: python update_tickers.py

      - name: Commit updated tickers if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tickers.json tickers-data.js
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: update ticker prices [skip ci]"
          git push

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }} --project portify-6467f
